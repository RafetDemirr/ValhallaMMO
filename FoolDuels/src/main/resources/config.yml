# ==========================================================
#  FoolDuels - Ayarlar
#  Mesajlar MiniMessage biçimindedir: <red>, <gold>, <bold> vb.
# ==========================================================

duel:
  # Düello isteğinin geçerlilik süresi (saniye)
  request-timeout: 60
  # Maç başlamadan önceki geri sayım (saniye). Bu sürede oyuncular hareket edemez ve hasar alamaz.
  countdown: 5
  # Bir maçın en uzun süresi (saniye). Süre dolunca normal düelloda berabere biter ve bahisler iade edilir.
  max-duration: 300
  # Maç bittikten sonra oyuncular kaç saniye sonra eski yerlerine gönderilsin
  end-delay: 3
  # Kendi envanteriyle düelloya izin ver
  allow-own-inventory: true
  # Kendi envanter modunda ölen oyuncu eşyalarını korusun mu?
  #  true  -> eşyalar kimseye düşmez, sadece maç içinde tüketilenler (elma, iksir, ok...) gider
  #  false -> ölen oyuncunun eşyaları yere düşer, kazanan toplayabilir
  own-inventory-keep-items-on-death: true
  # Kendi envanter modunda end-delay yerine kullanılacak süre (eşyalar düşüyorsa toplamak için zaman)
  own-inventory-loot-delay: 10
  # Maç başında tüm iksir efektlerini temizle
  clear-effects-on-start: true
  # Takım (parti) düellolarında takımların eşit sayıda olması zorunlu mu
  require-equal-teams: true

bet:
  # Vault yoksa bahis otomatik kapanır
  enabled: true
  min: 0
  max: 1000000
  # Menüdeki artır/azalt butonlarının miktarları
  steps: [10, 100, 1000]
  # Kazananların ödülünden kesilecek vergi (yüzde)
  tax-percent: 5

party:
  max-size: 4
  invite-timeout: 60

elo:
  enabled: true
  default: 1000
  k-factor: 32
  # Bahisli düellolar ELO'yu etkilesin mi
  count-bet-duels: true
  # Turnuva maçları ELO'yu etkilesin mi
  count-tournament: true

tournament:
  # Kazanma payları (yüzde). Birinci, ikinci, ...
  prizes: [70, 30]
  # Ödül havuzundan kesilecek vergi (yüzde)
  tax-percent: 0
  min-players: 2

backups:
  # Oyuncu başına saklanacak en fazla yedek sayısı
  max-per-player: 10

# Maç sırasında kullanılabilecek komutlar. Geri kalan HER ŞEY engellenir.
# (foolduels.bypass yetkisi olanlar etkilenmez)
command-whitelist:
  - duel
  - parti
  - party
  - turnuva
  - msg
  - tell
  - w
  - r
  - reply

protection:
  # Arena bölgesinde (pos1-pos2) blok kırma/koyma engeli
  block-changes: true
  # Maçta olmayan oyuncuların aktif arenaya girmesini engelle
  block-outsiders: true
  # Maçtaki oyuncu arena bölgesinden çıkarsa doğduğu yere geri ışınla
  keep-players-inside: true
  # Kit modunda eşya atmayı engelle
  block-item-drop-kit: true
  # Maç sırasında sandık, fıçı, ender sandığı vb. açmayı engelle
  block-containers: true

