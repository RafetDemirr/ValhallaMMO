# ==========================================================
#  FoolDuels - Ayarlar
#  Mesajlar MiniMessage biçimindedir: <red>, <gold>, <bold> vb.
# ==========================================================

duel:
  # Düello isteğinin geçerlilik süresi (saniye)
  request-timeout: 60
  # Aynı oyuncuya tekrar istek atmadan önce beklenecek süre (saniye)
  request-cooldown: 15
  # İstek reddedilince aynı oyuncuya tekrar istek atmadan önce beklenecek süre (saniye)
  deny-cooldown: 60
  # Maç başlamadan önceki geri sayım (saniye). Bu sürede oyuncular hareket edemez ve hasar alamaz.
  countdown: 5
  # Bir maçın en uzun süresi (saniye). Süre dolunca normal düelloda berabere biter ve bahisler iade edilir.
  max-duration: 300
  # Maç bittikten sonra oyuncular kaç saniye sonra eski yerlerine gönderilsin
  end-delay: 3
  # Kendi envanteriyle düelloya izin ver
  allow-own-inventory: true
  # Kendi envanter modunda ölen oyuncu eşyalarını korusun mu?
  #  true  -> eşyalar kimseye düşmez, sadece maç içinde tüketilenler (elma, iksir, ok...) gider
  #  false -> ölen oyuncunun eşyaları yere düşer, kazanan toplayabilir
  own-inventory-keep-items-on-death: true
  # Kendi envanter modunda end-delay yerine kullanılacak süre (eşyalar düşüyorsa toplamak için zaman)
  own-inventory-loot-delay: 10
  # Maç başında tüm iksir efektlerini temizle
  clear-effects-on-start: true
  # Takım (parti) düellolarında takımların eşit sayıda olması zorunlu mu
  require-equal-teams: true

bet:
  # Vault yoksa bahis otomatik kapanır
  enabled: true
  min: 0
  max: 1000000
  # Menüdeki artır/azalt butonlarının miktarları
  steps: [10, 100, 1000]
  # Kazananların ödülünden kesilecek vergi (yüzde)
  tax-percent: 5
  # Yetkiye göre vergi oranı. Oyuncunun sahip olduğu yetkilerden en düşük oran uygulanır.
  # 0 = vergi alınmaz. (Yetkiyi LuckPerms vb. ile ver: /lp user <oyuncu> permission set foolduels.tax.bypass)
  tax-permissions:
    vergisiz:
      permission: foolduels.tax.bypass
      tax: 0
    vip:
      permission: foolduels.tax.vip
      tax: 2

party:
  max-size: 4
  invite-timeout: 60

elo:
  enabled: true
  default: 1000
  k-factor: 32
  # Bahisli düellolar ELO'yu etkilesin mi
  count-bet-duels: true
  # Turnuva maçları ELO'yu etkilesin mi
  count-tournament: true

queue:
  # /duel sira <kit|kendi> - ELO'ya göre eşleşen 1v1 sıra sistemi
  enabled: true
  # Başlangıçta kabul edilen en fazla ELO farkı
  elo-range: 100
  # Beklenen her saniye için aralık bu kadar genişler
  elo-range-growth-per-second: 10
  max-elo-range: 1000

tournament:
  # Kazanma payları (yüzde) - para havuzu için. Birinci, ikinci, üçüncü(ler)
  prizes: [70, 30]
  # Ödül havuzundan kesilecek vergi (yüzde)
  tax-percent: 0
  min-players: 2
  # Turnuva maçlarındaki geri sayım (izleyiciler bu sürede bahis yapar)
  countdown: 15
  # Turnuva başlayınca kayıtlı oyuncuları lobiye ışınla (maç aralarında lobide beklerler)
  teleport-to-lobby: true

  # Preset kullanılmadan açılan turnuvaların ödül komutları.
  # Konsoldan çalışır. %player% = oyuncu adı, %uuid%, %place% = derece.
  # Oyuncu çevrimdışıysa komut kaydedilir ve oyuna girince çalışır.
  rewards:
    first: []
    second: []
    third: []
    participation: []

  # Hazır turnuvalar: /turnuva olustur <preset>
  presets:
    haftasonu:
      display-name: "<gold><bold>Haftasonu Turnuvası"
      fee: 0
      # kit adı ya da "kendi"
      kit: kendi
      # para havuzu payları (fee > 0 ise)
      prizes: [70, 30]
      # Kayıt açılınca duyurulacak satırlar
      announce:
        - "<yellow>1.</yellow> <white>Efsanevi Anahtar x3"
        - "<yellow>2.</yellow> <white>Efsanevi Anahtar x2"
        - "<yellow>3.</yellow> <white>Efsanevi Anahtar x1"
        - "<gray>Katılan herkese: <white>Normal Anahtar x1"
      rewards:
        # 1. (şampiyon)
        first:
          - "crates key give %player% efsanevi 3"
        # 2. (finalde kaybeden)
        second:
          - "crates key give %player% efsanevi 2"
        # 3. (yarı finalde kaybedenler; 4 kişiden fazla turnuvada 2 kişi)
        third:
          - "crates key give %player% efsanevi 1"
        # Genel giriş ödülü - kayıt olan herkes
        participation:
          - "crates key give %player% normal 1"

  # İzleyici bahisi: turnuva maçlarının geri sayımında /turnuva bahis <oyuncu> <miktar>
  # Kazanan tarafa bahis yapanlar havuzu yatırdıkları oranda paylaşır.
  spectator-bets:
    enabled: true
    min: 10
    max: 100000
    tax-percent: 5

backups:
  # Oyuncu başına saklanacak en fazla yedek sayısı
  max-per-player: 10

# Maç sırasında kullanılabilecek komutlar. Geri kalan HER ŞEY engellenir.
# (foolduels.bypass yetkisi olanlar etkilenmez)
command-whitelist:
  - duel
  - parti
  - party
  - turnuva
  - msg
  - tell
  - w
  - r
  - reply

protection:
  # WorldGuard pvp deny vb. olsa bile düellodaki rakipler birbirine vurabilsin
  force-allow-pvp: true
  # /back, /home, /warp, /tpa vb. ile arena bölgesine ışınlanmayı engelle (maçta olmayanlar için)
  block-teleport-into-arena: true
  # Arena bölgesinin içinde kullanılamayacak komutlar (maçta olmayanlar için)
  blocked-commands-in-arena:
    - sethome
    - createhome
    - setwarp
    - createwarp
    - setspawn
    - setjail
  # Arena bölgesinde (pos1-pos2) blok kırma/koyma engeli
  block-changes: true
  # Maçta olmayan oyuncuların aktif arenaya girmesini engelle
  block-outsiders: true
  # Maçtaki oyuncu arena bölgesinden çıkarsa doğduğu yere geri ışınla
  keep-players-inside: true
  # Kit modunda eşya atmayı engelle
  block-item-drop-kit: true
  # Maç sırasında sandık, fıçı, ender sandığı vb. açmayı engelle
  block-containers: true

